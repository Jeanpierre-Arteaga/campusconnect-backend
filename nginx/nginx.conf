# ============================================
# Nginx - Reverse Proxy para CampusConnect
# ============================================

events {
    worker_connections 1024;
}

http {
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream apunta al servicio backend del docker-compose
    upstream backend_servers {
        server backend:3000;
        # Para escalar horizontalmente, agrega más instancias:
        # server backend2:3000;
        # server backend3:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo del cuerpo de las peticiones (para subir archivos)
        client_max_body_size 50M;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Todas las rutas se redirigen al backend
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Endpoint de health check
        location /health {
            proxy_pass http://backend_servers/health;
            access_log off;
        }
    }
}