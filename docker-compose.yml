# ============================================
# docker-compose.yml - CampusConnect
# Universidad Innovatec
# ============================================

services:

  # ============================================
  # SERVICIO 1: Base de datos PostgreSQL
  # ============================================
  database:
    image: postgres:17-alpine
    container_name: campusconnect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dayana
    ports:
      - "5433:5432"   # 5433 en tu PC para no chocar con tu PostgreSQL local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusconnect_network

  # ============================================
  # SERVICIO 2: Backend Node.js
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusconnect_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: database          # nombre del servicio, no localhost
      DB_PORT: 5432              # puerto INTERNO de postgres
      DB_NAME: campusconnect
      DB_USER: postgres
      DB_PASSWORD: dayana
      JWT_SECRET: campusconnect_super_secret_key_2026_innovatec_X9k2mP4nQ7vL3jR8wT5yH6bF1cD0sZ
      JWT_EXPIRES_IN: 24h
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campusconnect_network

  # ============================================
  # SERVICIO 3: Nginx (Reverse Proxy)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: campusconnect_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - campusconnect_network

# ============================================
# Volúmenes (persistencia de datos)
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# Red interna para comunicación entre contenedores
# ============================================
networks:
  campusconnect_network:
    driver: bridge